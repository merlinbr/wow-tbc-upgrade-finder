name: TBC Upgrade Finder CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Verify TBC Upgrade Finder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Protoc Go plugin
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Generate proto and dist stubs
        run: make sim/core/proto/api.pb.go binary_dist/dist.go

      - name: Test upgrade ranking
        run: go test ./cmd/wowsimcli/cmd/upgrades -count=1

      - name: Test CLI packages
        run: go test ./cmd/wowsimcli/cmd/... -count=1

      - name: Build CLI
        run: go build -o wowsimcli ./cmd/wowsimcli

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: ui-finder
        run: npm ci

      - name: Build UI
        working-directory: ui-finder
        run: npm run build

      - name: Install Chromium
        working-directory: ui-finder
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        working-directory: ui-finder
        run: npm run test:e2e
