<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Equipped 3D feasibility harness (prototype — throwaway)</title>
  <style>
    body { background: #15181c; color: #cbd2d9; font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 0; padding: 16px; }
    h1 { font-size: 15px; margin: 0 0 4px; color: #e8eef2; }
    .note { color: #8a94a0; margin-bottom: 12px; }
    .layout { display: flex; gap: 16px; align-items: flex-start; }
    #stage { width: 540px; height: 680px; background: #0b0d10; border: 1px solid #3a4149; position: relative; }
    .side { flex: 1; min-width: 0; }
    #controls { display: flex; gap: 8px; margin-bottom: 12px; }
    #controls button { background: #232a31; color: #dce4ea; border: 1px solid #3a4149; padding: 6px 10px; cursor: pointer; }
    #controls button:hover { background: #2c353e; }
    #log { white-space: pre-wrap; max-height: 420px; overflow: auto; font-size: 12px; color: #9fb3c8; }
    #status { padding: 6px 10px; border: 1px solid #3a4149; margin-bottom: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Equipped character feasibility harness — ZAM TBC pipeline, same-origin transport</h1>
  <div class="note">Prototype only. Throws away. Mirrors the Classic WoW Armory integration shape: live viewer script + TBC content path + hd. Assets are served same-origin through the /zam Vite proxy.</div>
  <div id="status">waiting…</div>
  <div class="layout">
    <div id="stage"></div>
    <div class="side">
      <div id="controls">
        <button id="rotate">Rotate 45°</button>
        <button id="reset">Reset view</button>
        <button id="pause">Pause / play</button>
        <button id="resize">Resize to 380×480</button>
        <button id="destroy">Destroy</button>
        <button id="zoomout">Zoom out</button>
        <button id="zoomin">Zoom in</button>
      </div>
      <pre id="log"></pre>
    </div>
  </div>

  <script src="vendor/jquery-1.12.4.min.js"></script>
  <script src="https://wow.zamimg.com/modelviewer/live/viewer/viewer.min.js"></script>
  <script>
    'use strict';
    // Classic script: sets the WH shims before the module script runs.
    window.WH = window.WH || {};
    window.WH.debug = function () { console.log.apply(console, arguments); };
    window.WH.WebP = { getImageExtension: function () { return '.webp'; } };
  </script>
  <script type="module">
    import { FIXTURES, MH, CHEST } from './fixtures.js';

    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    function log(msg) { logEl.textContent += msg + '\n'; }
    function status(msg, cls) { statusEl.textContent = msg; statusEl.style.color = cls || ''; }

    function waitForViewer(ms) {
      return new Promise((resolve, reject) => {
        const t0 = Date.now();
        (function poll() {
          if (window.ZamModelViewer) return resolve(window.ZamModelViewer);
          if (Date.now() - t0 > ms) return reject(new Error('ZamModelViewer global not found after ' + ms + 'ms'));
          setTimeout(poll, 100);
        })();
      });
    }

    const CHARACTER_PART = {
      Face: 'face', 'Skin Color': 'skin', 'Hair Style': 'hairStyle', 'Hair Color': 'hairColor',
      'Facial Hair': 'facialStyle', Mustache: 'facialStyle', Beard: 'facialStyle',
      Sideburns: 'facialStyle', 'Face Shape': 'facialStyle', Eyebrow: 'facialStyle',
    };
    function getCharacterOptions(character, fullOptions) {
      const parts = fullOptions.Options || [];
      const ret = [];
      for (const prop in CHARACTER_PART) {
        const part = parts.find((e) => e.Name === prop);
        if (!part) continue;
        const key = CHARACTER_PART[prop];
        const choice = (key && character[key] !== undefined && part.Choices[character[key]])
          ? part.Choices[character[key]]
          : part.Choices[0];
        ret.push({ optionId: part.Id, choiceId: choice ? choice.Id : undefined });
      }
      return ret;
    }

    async function main() {
      status('loading…', '#e8b84b');
      const params = new URLSearchParams(location.search);
      const fx = FIXTURES[params.get('fixture') || 'paladin'];
      const CONTENT = location.origin + '/zam/modelviewer/tbc/';
      window.CONTENT_PATH = CONTENT;
      log('fixture: ' + fx.label + ' (mainhand=' + MH + ', chest=' + CHEST + ')');

      const ZamModelViewer = await waitForViewer(15000);

      const full = await fetch(CONTENT + 'meta/charactercustomization/' + (fx.race * 2 - 1 + fx.gender) + '.json').then((r) => r.json());
      const options = getCharacterOptions(fx.appearance, full);

      const items = fx.items.map(([slot, displayId]) => [
        slot === 'CHEST' ? CHEST : slot,
        displayId,
      ]);
      log('items: ' + JSON.stringify(items));

      const viewer = await new ZamModelViewer({
        type: 2,
        contentPath: CONTENT,
        container: jQuery('#stage'),
        aspect: 0.79,
        sheatheWeapons: 0,
        autoSheathe: 0,
        hd: true,
        items: items,
        models: { id: fx.race * 2 - 1 + fx.gender, type: 16 },
        charCustomization: { options: options },
      });
      window.viewer = viewer;
      log('viewer ready; canvas check in 4s…');

      setTimeout(() => {
        const hasCanvas = !!document.querySelector('#stage canvas');
        status('viewer created; canvas: ' + hasCanvas, hasCanvas ? '#7be07b' : '#e8b84b');
        log('after 4s — canvas in DOM: ' + hasCanvas);
      }, 4000);

      const model0 = () => viewer.renderer && (viewer.renderer.actors && viewer.renderer.actors[0] || viewer.renderer.models && viewer.renderer.models[0]);
      let paused = false;

      document.getElementById('rotate').onclick = () => {
        if (viewer.renderer) { viewer.renderer.azimuth += Math.PI / 4; log('rotate: azimuth now ' + viewer.renderer.azimuth.toFixed(3)); }
      };
      document.getElementById('reset').onclick = () => {
        if (viewer.renderer) { viewer.renderer.azimuth = 0; viewer.renderer.zenith = 0; log('reset: azimuth/zenith zeroed'); }
      };
      document.getElementById('pause').onclick = () => {
        paused = !paused;
        const m = model0();
        log('pause: clicked paused=' + paused + ' model0=' + !!m);
        if (m) { try { m.setAnimPaused(paused); log('pause: anim paused = ' + paused); } catch (e) { log('pause error: ' + e.message); } }
      };
      document.getElementById('resize').onclick = () => {
        try {
          const c = document.querySelector('#stage canvas');
          const before = c ? c.width + 'x' + c.height : 'none';
          viewer.renderer.resize(380, 480);
          setTimeout(() => {
            const c2 = document.querySelector('#stage canvas');
            log('resize: before ' + before + ' → after ' + (c2 ? c2.width + 'x' + c2.height : 'none'));
          }, 500);
        } catch (e) { log('resize error: ' + e.message); }
      };
      document.getElementById('destroy').onclick = () => {
        try {
          viewer.destroy();
          log('destroy: called; canvas remains: ' + !!document.querySelector('#stage canvas'));
        } catch (e) {
          log('destroy: error ' + e.message);
        }
      };
      document.getElementById('zoomout').onclick = () => {
        const r = viewer.renderer;
        if (!r) return;
        const before = r.distance;
        r.distance = (typeof r.distance === 'number' ? r.distance : 1) * 1.1;
        if (r.zoom) { r.zoom.target = 0; }
        log('zoomout: distance ' + before + ' → ' + r.distance);
      };
      document.getElementById('zoomin').onclick = () => {
        const r = viewer.renderer;
        if (!r) return;
        r.distance = (typeof r.distance === 'number' ? r.distance : 1) / 1.1;
        log('zoomin: distance → ' + r.distance);
      };
    }

    window.addEventListener('error', (e) => { status('error: ' + e.message, '#e46a6a'); log('window error: ' + (e.error && e.error.stack || e.message)); });
    window.addEventListener('unhandledrejection', (e) => { status('rejection: ' + e.reason, '#e46a6a'); log('unhandled rejection: ' + (e.reason && e.reason.stack || e.reason)); });

    main().catch((e) => { status('FAILED: ' + e.message, '#e46a6a'); log('main failed: ' + (e.stack || e)); });
  </script>
</body>
</html>
